<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="m1" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%"  stop-color="#f4c0cc"/>
      <stop offset="30%" stop-color="#9e2347"/>
      <stop offset="70%" stop-color="#7D1535"/>
      <stop offset="100%" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="m2" x1="90%" y1="5%" x2="10%" y2="95%">
      <stop offset="0%"  stop-color="#f0b8c8"/>
      <stop offset="50%" stop-color="#8c1e3a"/>
      <stop offset="100%" stop-color="#400c18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fce8ec"/>
      <stop offset="100%" stop-color="#c87090"/>
    </linearGradient>
    <filter id="g">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#9e2347" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Upper S arm -->
  <path d="M 25,42 C 18,40 14,34 15,26 C 16,18 23,13 32,12 C 41,11 49,16 51,24 C 53,30 50,35 45,38"
