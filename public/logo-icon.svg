  <!-- Lower S arm -->
  <path d="M 55,48 C 62,50 66,56 65,64 C 64,72 57,77 48,78 C 39,79 31,74 29,66 C 27,60 30,55 35,52"
    fill="none" stroke="url(#m2)" stroke-width="10" stroke-linecap="round" filter="url(#g)"/>
  <!-- Sound bars -->
  <rect x="36" y="36" width="3" height="10" rx="1.5" fill="url(#bar)"/>
  <rect x="41" y="33" width="3" height="16" rx="1.5" fill="url(#bar)"/>
  <rect x="46" y="35" width="3" height="12" rx="1.5" fill="url(#bar)"/>
  <!-- Sparkles -->
  <ellipse cx="56" cy="18" rx="5" ry="2.5" fill="url(#m1)" transform="rotate(-35 56 18)"/>
  <ellipse cx="63" cy="11" rx="3" ry="1.5" fill="url(#m2)" transform="rotate(-30 63 11)"/>
